# =============================================================================
# render.yaml — Blueprint de deploy no Render (Infrastructure as Code)
#
# Monorepo, 2 branches dedicadas de deploy (DEC-17, simplificado em
# 2026-08-05 — DEC-22): staging_back/staging_front/staging foram removidas
# por nunca terem sido de fato provisionadas no Render (faltava credencial,
# ver HT-04) e por gerarem confusão sem uso real. Ambiente único de produção:
#   - main_back   → produção do backend  (garra-backend)
#   - main_front  → produção do frontend (garra-frontend)
#
# `main` continua sendo o TRUNK único onde todo commit/PR é integrado
# (inclusive Dependabot). Um workflow dedicado (.github/workflows/
# sync-deploy-branches.yml) mescla `main` automaticamente em `main_back` e
# `main_front` a cada push — não commitar direto nessas duas branches nem
# redirecionar PRs para elas manualmente (foi a causa da desorganização
# anterior: deploy ficava semanas defasado de `main`).
#
# Como usar (uma vez só, feito pelo humano no Dashboard do Render):
#   1. https://dashboard.render.com/ → New → Blueprint.
#   2. Conectar o repositório GitHub `rafaelroriz-age/garra-engenharia`.
#   3. Render detecta este arquivo e mostra o preview dos recursos: 2
#      serviços web (garra-backend/garra-frontend) e 1 banco (garra-db).
#   4. Preencher os campos com `sync: false` quando solicitado (nenhum nesta
#      versão — todos os segredos usam `generateValue`/`fromDatabase`).
#   5. Clicar em "Apply" — Render provisiona os recursos e faz o 1º deploy
#      de cada um, a partir da branch configurada em cada serviço.
#
# Após o 1º deploy, confira as URLs reais em cada serviço no Dashboard
# (Settings → URL). Se o Render tiver atribuído um hostname diferente do
# previsto abaixo (porque o nome já estava em uso por outra conta), atualize
# `NEXT_PUBLIC_API_URL` e `BACKEND_CORS_ORIGINS` manualmente nas env vars do
# serviço afetado e clique em "Manual Deploy".
#
# Ver detalhes e troubleshooting em 05_infra/README.md § "Deploy em produção
# (Render)".
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend — API FastAPI, produção (DEC-05) — branch main_back
  # ---------------------------------------------------------------------------
  - type: web
    name: garra-backend
    runtime: docker
    branch: main_back
    dockerfilePath: ./04_backend/Dockerfile.render
    dockerContext: ./04_backend
    region: oregon
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Roda as migrations do Alembic antes de cada deploy (schema sempre em
    # dia com o código, sem passo manual).
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      # O serviço `garra-backend` realmente provisionado usa o runtime NATIVO
      # do Render (criado via MCP, não pelo Apply deste Blueprint) e por isso
      # NÃO tem `preDeployCommand` — nele esta variável precisa ser "true"
      # para o `alembic upgrade head` rodar no boot (app/core/migrations.py).
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      # URL pública do frontend — ajuste se o Render atribuir outro hostname
      # (ver comentário no topo do arquivo).
      - key: BACKEND_CORS_ORIGINS
        value: https://garra-frontend.onrender.com
      # Credenciais do Postgres, lidas diretamente do banco gerenciado abaixo
      # (nunca hardcoded).
      - key: POSTGRES_HOST
        fromDatabase:
          name: garra-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: garra-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: garra-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: garra-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: garra-db
          property: database
      # Segredo do JWT (RNF-05) — gerado automaticamente pelo Render na
      # criação do Blueprint, nunca aparece neste arquivo.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Legenda por IA (DEC-42 C): limites de geração e teto da saída. Não são segredos,
      # então valor fixo igual ao default de config.py e de 04_backend/.env.example.
      - key: LEGENDA_IA_LIMITE_POR_USUARIO
        value: "10"
      - key: LEGENDA_IA_JANELA_USUARIO_SEGUNDOS
        value: "60"
      - key: LEGENDA_IA_LIMITE_DIARIO_POR_USUARIO
        value: "200"
      - key: LEGENDA_IA_LIMITE_POR_FOTO
        value: "5"
      - key: LEGENDA_IA_JANELA_FOTO_SEGUNDOS
        value: "3600"
      - key: LEGENDA_IA_SAIDA_MAX_CARACTERES
        value: "500"
      - key: LEGENDA_IA_SAIDA_MAX_ITENS
        value: "20"
      - key: LEGENDA_IA_SAIDA_MAX_CARACTERES_ITEM
        value: "300"
      # Provedor de legenda por IA (B-04): DeepSeek. Chave é segredo: sync false.
      - key: LEGENDA_IA_PROVEDOR
        value: fake
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODELO
        value: deepseek-flash
      - key: DEEPSEEK_TIMEOUT_S
        value: "30"
      - key: DEEPSEEK_ENVIAR_IMAGEM
        value: "false"
      # Telemetria/cache local (BL-34): preços por 1M de tokens vazios até a IA-07.
      - key: LEGENDA_IA_CACHE_TTL_H
        value: "720"
      - key: DEEPSEEK_PRECO_ENTRADA_CACHE_HIT_USD
        value: ""
      - key: DEEPSEEK_PRECO_ENTRADA_CACHE_MISS_USD
        value: ""
      - key: DEEPSEEK_PRECO_SAIDA_USD
        value: ""
      # Armazenamento de fotos/documentos (MinIO/S3, DEC-02) FICOU FORA do
      # escopo deste Blueprint (só backend+frontend+banco foram pedidos).
      # Sem estas variáveis, a API sobe normalmente, mas os endpoints de
      # upload/foto (BL-11) falham. Para habilitar, defina manualmente no
      # Dashboard (Settings → Environment) apontando para um provedor
      # S3-compatível (ex.: Cloudflare R2, AWS S3, Backblaze B2) ou provisione
      # o MinIO como um "private service" adicional com disco persistente —
      # ver 05_infra/README.md.
      # - key: MINIO_HOST
      #   sync: false
      # - key: MINIO_ROOT_USER
      #   sync: false
      # - key: MINIO_ROOT_PASSWORD
      #   sync: false
      # - key: MINIO_BUCKET_NAME
      #   value: relatorios-prediais
      # - key: MINIO_USE_SSL
      #   value: "true"

  # ---------------------------------------------------------------------------
  # Frontend — Next.js 14 PWA, produção (DEC-03/DEC-06) — branch main_front
  # ---------------------------------------------------------------------------
  - type: web
    name: garra-frontend
    runtime: docker
    branch: main_front
    dockerfilePath: ./03_frontend/Dockerfile.render
    dockerContext: ./03_frontend
    region: oregon
    plan: starter
    autoDeployTrigger: commit
    envVars:
      # Variável NEXT_PUBLIC_* — precisa existir em BUILD TIME (o Render
      # injeta automaticamente como Docker build arg, ver Dockerfile.render).
      # Ajuste se o Render atribuir outro hostname ao backend.
      - key: NEXT_PUBLIC_API_URL
        value: https://garra-backend.onrender.com/api/v1

# =============================================================================
# Bancos de dados — PostgreSQL gerenciado (DEC-07)
# =============================================================================
databases:
  # Valores alinhados ao banco realmente provisionado no Render em 2026-08-03
  # (criado via MCP, não pelo Apply deste Blueprint).
  - name: garra-db
    databaseName: garra_db
    user: garra_db_user
    plan: basic-256mb
    region: oregon
