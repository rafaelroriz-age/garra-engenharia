[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog-auto"
version = "0.1.0"
description = "Backlog em Markdown executado por sessões background do Claude Code, com roteamento de modelo, integração automática e barreira de segurança."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
backlog-auto = "backlog_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backlog_auto = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
