<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#253341" />
    <title>Sem conexão · Garra Perícias e Avaliações</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f8fafc; color: #253341; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 28rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
      p { line-height: 1.5; margin: .5rem 0; }
      button { margin-top: 1.25rem; padding: .7rem 1.4rem; border: 0; border-radius: .5rem;
        background: #253341; color: #fff; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Você está sem conexão</h1>
      <p>O registro de dados (visitas, ocorrências e fotos) exige conexão com a internet.</p>
      <p>Reconecte-se a uma rede 4G ou Wi-Fi e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
