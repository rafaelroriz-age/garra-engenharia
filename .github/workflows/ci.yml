# Integração Contínua — roda em todo Pull Request e em push para o trunk
# (`main`) e para as branches de deploy de produção (`main_back`/`main_front`,
# DEC-17). Staging (staging_back/staging_front/staging) foi removida em
# 2026-08-05 (DEC-22) por nunca ter sido de fato provisionada no Render.
# Ver 00_docs/projeto/plano-gestao-configuracao.md (Seção 3.1) e decisoes.md
# DEC-14/DEC-17/DEC-22.
#
# Este workflow é o "status check" obrigatório para merge em `main`
# (branch protection, configurado manualmente em Settings > Branches do
# repositório GitHub — ver HT-05 em backlog-tarefas-humanas.md). Push em
# main_back/main_front só acontece via .github/workflows/sync-deploy-branches.yml,
# nunca commit direto — mas o CI roda igual nelas por segurança.
#
# Job `e2e` (BL-21): sobe a stack de dev via 05_infra/docker-compose.yml e roda
# os testes Playwright dos Fluxos RFO/LTIP (03_frontend/e2e/*.spec.ts) contra
# ela — ver "Testes E2E (Playwright, BL-21)" em 03_frontend/README.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main_front, main_back, main]

# Cancela execuções antigas do mesmo PR/branch quando um novo push chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip-backend') }}
    defaults:
      run:
        working-directory: 04_backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garra
          POSTGRES_PASSWORD: garra_ci
          POSTGRES_DB: garra_engenharia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garra -d garra_engenharia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      POSTGRES_USER: garra
      POSTGRES_PASSWORD: garra_ci
      POSTGRES_DB: garra_engenharia_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 04_backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.1

      # Lint ainda não é bloqueante: o backend foi escrito antes deste workflow existir
      # (BL-26). Tornar `continue-on-error: false` após uma primeira passada de limpeza.
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Testes (pytest)
        run: pytest --maxfail=1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 03_frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (next lint)
        run: npm run lint
        continue-on-error: true

      - name: Build de produção
        run: npm run build

  docker-build-scan:
    name: Build de imagens + scan de vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - nome: backend
            contexto: 04_backend
          - nome: frontend
            contexto: 03_frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem ${{ matrix.nome }} (sem push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          push: false
          load: true
          tags: garra-${{ matrix.nome }}:ci
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

      - name: Scan Trivy — garra-${{ matrix.nome }}:ci
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: garra-${{ matrix.nome }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  e2e:
    name: Testes E2E (Playwright — Fluxos RFO e LTIP, BL-21)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 03_frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: 03_frontend
        run: npm ci

      - name: Instalar navegadores do Playwright (Chromium)
        working-directory: 03_frontend
        run: npx playwright install --with-deps chromium

      - name: Subir a stack local (05_infra/docker-compose.yml)
        working-directory: 05_infra
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Aguardar backend/frontend saudáveis
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              echo "Stack pronta."; exit 0
            fi
            echo "Aguardando stack subir... ($i/30)"; sleep 5
          done
          echo "Timeout aguardando backend/frontend ficarem saudáveis."
          cd 05_infra && docker compose logs --tail=100
          exit 1

      - name: Aplicar migrations e seed do gabarito (BL-04, BL-05)
        working-directory: 05_infra
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend python -m app.scripts.seed_gabarito
          # Auditor de bootstrap: /auth/register exige auditor autenticado desde BL-23.
          docker compose exec -T backend python -m app.scripts.seed_admin

      - name: Rodar testes E2E (Fluxos RFO e LTIP)
        working-directory: 03_frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:8000/api/v1
        run: npx playwright test

      - name: Publicar relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 03_frontend/playwright-report/
          retention-days: 7

      - name: Derrubar a stack local
        if: always()
        working-directory: 05_infra
        run: docker compose down -v
