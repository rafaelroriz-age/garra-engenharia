# Integração Contínua — roda em todo Pull Request e em push para `main`.
# Ver 00_docs/projeto/plano-gestao-configuracao.md (Seção 3.1) e decisoes.md DEC-14.
#
# Este workflow é o "status check" obrigatório para merge em `main` (branch protection,
# configurado manualmente em Settings > Branches do repositório GitHub).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela execuções antigas do mesmo PR/branch quando um novo push chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip-backend') }}
    defaults:
      run:
        working-directory: 04_backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garra
          POSTGRES_PASSWORD: garra_ci
          POSTGRES_DB: garra_engenharia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garra -d garra_engenharia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      POSTGRES_USER: garra
      POSTGRES_PASSWORD: garra_ci
      POSTGRES_DB: garra_engenharia_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 04_backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # Lint ainda não é bloqueante: o backend foi escrito antes deste workflow existir
      # (BL-26). Tornar `continue-on-error: false` após uma primeira passada de limpeza.
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Testes (pytest)
        run: pytest --maxfail=1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 03_frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (next lint)
        run: npm run lint
        continue-on-error: true

      - name: Build de produção
        run: npm run build

  docker-build-scan:
    name: Build de imagens + scan de vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - nome: backend
            contexto: 04_backend
          - nome: frontend
            contexto: 03_frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem ${{ matrix.nome }} (sem push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: false
          load: true
          tags: garra-${{ matrix.nome }}:ci
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

      - name: Scan Trivy — garra-${{ matrix.nome }}:ci
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: garra-${{ matrix.nome }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
