# Propaga todo envio para `main` à branch de deploy do backend (`main_back`),
# que o serviço do Render observa (DEC-59, go-live no Render + GitHub Pages).
# O front não precisa de branch própria: o GitHub Pages publica direto de `main`
# (deploy-pages.yml). A propagação usa o merge do lado do servidor da API do
# GitHub (sem checkout, sem force). Se houver conflito, abre issue.
name: Sync deploy branches (main -> main_back)

on:
  # Só propaga depois que o CI de `main` passar: o Render observa `main_back`.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-deploy-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main em main_back
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Merge no servidor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(gh api -X POST "repos/${{ github.repository }}/merges" \
            -f base=main_back -f head=main \
            -f commit_message="chore(infra): sincroniza main_back com main [skip ci]" 2>&1)
          code=$?
          echo "$out"
          # 204 (já em dia) vem sem corpo e sem erro; 409 = conflito
          if [ $code -ne 0 ] && ! echo "$out" | grep -q "Nothing to merge"; then
            exit 1
          fi

      - name: Falha -> abrir issue de conflito
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Conflito ao sincronizar main -> main_back",
              body: `O merge automático de main em main_back falhou (provável conflito). Resolva localmente com merge de main em main_back e envie. Commit: ${context.sha}`,
              labels: ["ci-failure", "deploy"]
            });
