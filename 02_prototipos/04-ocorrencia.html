<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Ocorrência · Garra Engenharia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: {
      colors: { navy:'#1e3a5f', 'navy-deep':'#152a45', accent:'#f97316', surface:'#f8fafc', ink:'#0f172a', muted:'#64748b', success:'#22c55e', warning:'#eab308', danger:'#ef4444' },
      fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'] },
    }}};
  </script>
  <style>
    body{font-family:'Inter',sans-serif}
    h1,h2,h3,.font-display{font-family:'Manrope',sans-serif}
    .field{transition:border-color .2s,box-shadow .2s}
    .field:focus{outline:none;border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.15)}
    .modal-in{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
    @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
    input[type=range]{-webkit-appearance:none;height:6px;border-radius:999px;background:#e2e8f0;outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#f97316;cursor:pointer;box-shadow:0 2px 6px rgba(249,115,22,.4);transition:transform .15s}
    input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2)}
    .cmm-btn{transition:all .18s}
  </style>
</head>
<body class="bg-navy/80 text-ink antialiased min-h-screen grid place-items-center p-4" style="background:radial-gradient(circle at 30% 20%, rgba(30,58,95,.55), rgba(15,23,42,.85))">

  <!-- Backdrop context (blurred dashboard hint) -->
  <div class="modal-in bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <div>
        <p class="text-xs font-semibold text-accent uppercase tracking-wide">Nova ocorrência</p>
        <h2 class="font-display font-bold text-lg">Registrar item inspecionado</h2>
      </div>
      <a href="03-nova-vistoria.html" class="w-9 h-9 rounded-lg grid place-items-center text-muted hover:bg-slate-100 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </a>
    </div>

    <!-- Body -->
    <div class="p-6 overflow-y-auto space-y-6">

      <!-- sistema/subsistema -->
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium">Sistema predial</label>
          <select class="field w-full mt-1.5 px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-sm">
            <option>Impermeabilização</option>
            <option>Cobertura e Telhamento</option>
            <option>Revestimentos</option>
            <option>Sistemas Elétricos</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium">Subsistema</label>
          <select class="field w-full mt-1.5 px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-sm">
            <option>Platibanda</option>
            <option>Calhas e Rufos</option>
            <option>Lajes e Mantas</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="text-sm font-medium">Localização</label>
          <input type="text" value="Cobertura – Bloco A, face Norte" class="field w-full mt-1.5 px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-sm" />
        </div>
        <div class="sm:col-span-2">
          <label class="text-sm font-medium">Descrição da ocorrência</label>
          <textarea rows="3" class="field w-full mt-1.5 px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-sm">Infiltração ativa na platibanda com destacamento da manta asfáltica e manchas de umidade na laje inferior.</textarea>
        </div>
      </div>

      <!-- Classificação CMM -->
      <div>
        <label class="text-sm font-medium block mb-2">Grau de risco (CMM)</label>
        <div class="grid grid-cols-3 gap-3">
          <button data-cmm="min" class="cmm-btn rounded-xl border-2 border-slate-200 py-3 text-center hover:border-success">
            <span class="block w-3 h-3 rounded-full bg-success mx-auto mb-1.5"></span>
            <span class="text-sm font-semibold">Mínimo</span>
            <span class="block text-xs text-muted">Estético</span>
          </button>
          <button data-cmm="med" class="cmm-btn rounded-xl border-2 border-slate-200 py-3 text-center hover:border-warning">
            <span class="block w-3 h-3 rounded-full bg-warning mx-auto mb-1.5"></span>
            <span class="text-sm font-semibold">Médio</span>
            <span class="block text-xs text-muted">Agravável</span>
          </button>
          <button data-cmm="cri" class="cmm-btn rounded-xl border-2 border-danger bg-danger/5 py-3 text-center">
            <span class="block w-3 h-3 rounded-full bg-danger mx-auto mb-1.5"></span>
            <span class="text-sm font-semibold">Crítico</span>
            <span class="block text-xs text-muted">Imediato</span>
          </button>
        </div>
      </div>

      <!-- Matriz GUT -->
      <div class="rounded-xl bg-surface border border-slate-200 p-5">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="font-display font-bold text-sm">Matriz GUT</h3>
            <p class="text-xs text-muted">Gravidade · Urgência · Tendência</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-muted">Prioridade</p>
            <p id="gutTotal" class="font-display font-extrabold text-2xl text-accent">125</p>
          </div>
        </div>
        <div class="space-y-5">
          <div>
            <div class="flex justify-between text-sm mb-1.5"><label class="font-medium">Gravidade</label><span class="gval font-semibold text-navy">5</span></div>
            <input type="range" min="1" max="5" value="5" class="gut w-full" />
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1.5"><label class="font-medium">Urgência</label><span class="gval font-semibold text-navy">5</span></div>
            <input type="range" min="1" max="5" value="5" class="gut w-full" />
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1.5"><label class="font-medium">Tendência</label><span class="gval font-semibold text-navy">5</span></div>
            <input type="range" min="1" max="5" value="5" class="gut w-full" />
          </div>
        </div>
      </div>

      <!-- Upload foto -->
      <div>
        <label class="text-sm font-medium block mb-2">Registro fotográfico (Lightshot)</label>
        <div class="grid grid-cols-3 gap-3">
          <!-- preview -->
          <div class="relative rounded-xl overflow-hidden border border-slate-200 aspect-square">
            <div class="w-full h-full bg-gradient-to-br from-slate-300 to-slate-400 grid place-items-center text-white/70">
              <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909M18 9.75h.008v.008H18V9.75Z"/></svg>
            </div>
            <button class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/50 grid place-items-center text-white hover:bg-danger transition">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <!-- paste area -->
          <label class="col-span-2 rounded-xl border-2 border-dashed border-slate-300 grid place-items-center text-center p-4 cursor-pointer hover:border-accent hover:bg-accent/5 transition">
            <div>
              <svg class="w-7 h-7 mx-auto text-muted mb-1.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 0 0-2.25 2.25v9a2.25 2.25 0 0 0 2.25 2.25h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25H15M9 12l3 3m0 0 3-3m-3 3V2.25"/></svg>
              <p class="text-sm font-semibold">Colar (Ctrl+V) ou arrastar foto</p>
              <p class="text-xs text-muted mt-0.5">Capturas do Lightshot são coladas direto</p>
            </div>
            <input type="file" class="hidden" accept="image/*" />
          </label>
        </div>
        <input type="text" placeholder="Legenda técnica da foto..." class="field w-full mt-3 px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-sm" value="Destacamento de manta na platibanda – face Norte" />
      </div>

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100 bg-surface">
      <a href="03-nova-vistoria.html" class="px-5 py-2.5 rounded-xl border border-slate-200 font-semibold text-muted hover:border-navy hover:text-navy transition">Cancelar</a>
      <a href="03-nova-vistoria.html" class="px-5 py-2.5 rounded-xl bg-accent text-white font-semibold hover:bg-accent/90 active:scale-95 transition flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
        Salvar ocorrência
      </a>
    </div>
  </div>

<script>
  const guts = document.querySelectorAll('.gut');
  const totalEl = document.getElementById('gutTotal');
  function recalc(){
    let p = 1;
    guts.forEach(g => { p *= +g.value; });
    totalEl.textContent = p;
  }
  guts.forEach(g => g.addEventListener('input', e => {
    e.target.closest('div').querySelector('.gval').textContent = e.target.value;
    recalc();
  }));

  // CMM select
  document.querySelectorAll('.cmm-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.cmm-btn').forEach(x => { x.className = 'cmm-btn rounded-xl border-2 border-slate-200 py-3 text-center'; });
    const map = { min:'hover:border-success', med:'hover:border-warning', cri:'border-danger bg-danger/5' };
    const color = { min:'border-success bg-success/5', med:'border-warning bg-warning/5', cri:'border-danger bg-danger/5' };
    b.className = 'cmm-btn rounded-xl border-2 py-3 text-center ' + color[b.dataset.cmm];
  }));
</script>
</body>
</html>
