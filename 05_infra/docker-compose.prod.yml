# =============================================================================
# 05_infra/docker-compose.prod.yml — BL-27
# Stack de PRODUÇÃO/STAGING para hospedagem em VPS próprio (Docker + Nginx).
#
# ATENÇÃO — quando este arquivo é (e não é) usado:
#   A hospedagem oficial do projeto é o Render (DEC-16/BL-20), definida como
#   código em `render.yaml` (aposentado no T85, DEC-57). Este compose é o caminho ALTERNATIVO,
#   para o cenário de VPS próprio previsto em DEC-14/DEC-17 e consumido pelos
#   workflows de fallback `cd-staging.yml`/`cd-production.yml`.
#
# Diferenças em relação ao `docker-compose.yml` (desenvolvimento):
#   - Usa IMAGENS PRONTAS do GHCR (tag imutável em `IMAGE_TAG`), nunca `build:`
#     nem `latest` — permite rollback determinístico (plano de gestão de
#     configuração, Seção 4.1/4.2).
#   - Nenhuma porta de banco/objeto é publicada no host: só o Nginx expõe
#     80/443 (Seção 7 do plano, OWASP A05).
#   - Nginx faz TLS termination + reverse proxy para frontend e backend.
#
# Uso (a partir de 05_infra/, no host de produção):
#   cp .env.example .env          # preencher com os segredos reais de produção
#   export IMAGE_TAG=v1.0.0       # ou staging-<sha>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
#   docker compose -f docker-compose.prod.yml up -d
#
# Rollback: trocar IMAGE_TAG pela versão anterior e repetir `pull` + `up -d`.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: garra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env de produção}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env de produção}
      POSTGRES_DB: ${POSTGRES_DB:-garra_engenharia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup/dumps:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-garra_engenharia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - garra-net

  minio:
    image: minio/minio:latest
    container_name: garra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env de produção}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env de produção}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - garra-net

  createbuckets:
    image: minio/mc:latest
    container_name: garra-minio-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-relatorios-prediais}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$MINIO_BUCKET_NAME\" &&
      echo 'Bucket pronto.'
      "
    networks:
      - garra-net

  backend:
    image: "ghcr.io/${GITHUB_REPOSITORY:-rafaelroriz-age/garra-engenharia}/backend:${IMAGE_TAG:?defina IMAGE_TAG (ex.: v1.0.0 ou staging-<sha>)}"
    container_name: garra-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?defina o(s) domínio(s) do frontend}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-garra_engenharia}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-relatorios-prediais}
      MINIO_HOST: minio
      MINIO_API_PORT: 9000
      MINIO_USE_SSL: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env de produção}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Legenda por IA (DEC-42 C): limites de geração e teto da saída. Defaults iguais a config.py.
      LEGENDA_IA_LIMITE_POR_USUARIO: ${LEGENDA_IA_LIMITE_POR_USUARIO:-10}
      LEGENDA_IA_JANELA_USUARIO_SEGUNDOS: ${LEGENDA_IA_JANELA_USUARIO_SEGUNDOS:-60}
      LEGENDA_IA_LIMITE_DIARIO_POR_USUARIO: ${LEGENDA_IA_LIMITE_DIARIO_POR_USUARIO:-200}
      LEGENDA_IA_LIMITE_POR_FOTO: ${LEGENDA_IA_LIMITE_POR_FOTO:-5}
      LEGENDA_IA_JANELA_FOTO_SEGUNDOS: ${LEGENDA_IA_JANELA_FOTO_SEGUNDOS:-3600}
      LEGENDA_IA_SAIDA_MAX_CARACTERES: ${LEGENDA_IA_SAIDA_MAX_CARACTERES:-500}
      LEGENDA_IA_SAIDA_MAX_ITENS: ${LEGENDA_IA_SAIDA_MAX_ITENS:-20}
      LEGENDA_IA_SAIDA_MAX_CARACTERES_ITEM: ${LEGENDA_IA_SAIDA_MAX_CARACTERES_ITEM:-300}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - garra-net

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-rafaelroriz-age/garra-engenharia}/frontend:${IMAGE_TAG}
    container_name: garra-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina a URL pública da API (com sufixo /api/v1)}
    depends_on:
      - backend
    networks:
      - garra-net

  nginx:
    image: nginx:1.27-alpine
    container_name: garra-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - garra-net

  # Renovação automática do certificado Let's Encrypt (webroot). Emissão inicial:
  #   docker compose -f docker-compose.prod.yml run --rm --entrypoint "certbot certonly \
  #     --webroot -w /var/www/certbot -d SEU.DOMINIO --email SEU@EMAIL --agree-tos --no-eff-email" certbot
  certbot:
    image: certbot/certbot:latest
    container_name: garra-certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - garra-net

volumes:
  postgres_data:
    name: garra_postgres_data
  minio_data:
    name: garra_minio_data
  certbot_webroot:
    name: garra_certbot_webroot

networks:
  garra-net:
    name: garra-net
    driver: bridge
