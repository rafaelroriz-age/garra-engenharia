# =============================================================================
# 05_infra/nginx/nginx.conf — BL-27
# Reverse proxy + TLS termination da stack de produção (docker-compose.prod.yml).
#
# Rotas:
#   /            -> frontend (Next.js, porta 3000 na rede interna)
#   /api/        -> backend  (FastAPI, porta 8000 na rede interna)
#   /health      -> backend  (usado pelo healthcheck externo/monitoramento)
#   /.well-known/acme-challenge/ -> webroot do certbot (renovação Let's Encrypt)
#
# Substitua SEU.DOMINIO pelo domínio real antes do primeiro deploy. Enquanto
# não houver certificado emitido, comente o bloco `server` de 443 e mantenha
# apenas o de 80 (sem o redirect), para o certbot conseguir validar o desafio.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Uploads de foto (BL-11) e download de relatórios grandes (BL-12/BL-13/BL-22).
    client_max_body_size 50m;

    # Geração de relatório pode levar até ~60s (RNF-06) antes de virar job assíncrono.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Rate limiting do login (OWASP A07, arquitetura.md Seção 10.1).
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    # HTTP: só serve o desafio ACME e redireciona o resto para HTTPS.
    server {
        listen 80;
        server_name SEU.DOMINIO;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name SEU.DOMINIO;

        ssl_certificate     /etc/nginx/certs/live/SEU.DOMINIO/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/SEU.DOMINIO/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Cabeçalhos de segurança (OWASP A05). HSTS só depois de confirmar que
        # todo o tráfego já funciona em HTTPS — desfazer exige esperar o max-age.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Não revelar a versão do servidor.
        server_tokens off;

        location /api/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
